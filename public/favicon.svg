<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Deep Celestial Disc -->
  <circle cx="32" cy="32" r="30" fill="#0B1026" stroke="#B9A9FF" stroke-width="1.5" stroke-opacity="0.5"/>
  
  <!-- Subtle Inner Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#cosmicGrad)" opacity="0.4"/>

  <!-- Golden Crescent Moon -->
  <path d="M32 12C20.95 12 12 20.95 12 32C12 43.05 20.95 52 32 52C26.5 46.5 23.5 39.5 23.5 32C23.5 24.5 26.5 17.5 32 12Z" fill="url(#moonGrad)"/>

  <!-- Bright 4-Point Star Sparkle -->
  <path d="M43 18C43 23 40 26 35 26C40 26 43 29 43 34C43 29 46 26 51 26C46 26 43 23 43 18Z" fill="#E8D5A5"/>

  <!-- Tiny Companion Star -->
  <circle cx="46" cy="42" r="2" fill="#B9D9FF" opacity="0.9"/>
  <circle cx="38" cy="46" r="1.2" fill="#FFFFFF" opacity="0.75"/>

  <!-- Gradients -->
  <defs>
    <radialGradient id="cosmicGrad" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B9A9FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0B1026" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moonGrad" x1="12" y1="12" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#E8D5A5"/>
      <stop offset="100%" stop-color="#B9A9FF"/>
    </linearGradient>
  </defs>
</svg>
